<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/head :: headFragment}"></th:block>
<body>
<header th:replace="~{fragments/navbar :: navbarFragment}"></header>
<main>
    <h2>Регистрация</h2>
    <div th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" th:text="${successMessage}"></div>
    <form th:action="@{/users/register}" th:method="post" th:object="${userRegistrationDto}">
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div>
            <label for="password">Пароль:</label>
            <input type="password" id="password" th:field="*{password}" required>
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div>
            <label for="confirmPassword">Подтвердите пароль:</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>
</main>
<footer th:replace="~{fragments/footer :: footerFragment}"></footer>
</body>
</html>
